<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071425">
  <meta name="color-scheme" content="light dark">
  <title>BTM 2026 · Offline</title>
  <style>
    :root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#071425;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));background:radial-gradient(circle at 80% 20%,#244f8066,transparent 35%),linear-gradient(145deg,#071425,#17375f)}main{width:min(100%,420px);text-align:center}.icon{width:86px;height:86px;margin:0 auto 24px;border-radius:22px;box-shadow:0 20px 50px #0005}h1{margin:0;font-size:2rem;letter-spacing:-.04em}p{margin:12px auto 0;max-width:34ch;color:#cfe3f1;line-height:1.55}.button{display:inline-flex;align-items:center;justify-content:center;min-height:50px;margin-top:28px;padding:0 22px;border-radius:15px;background:#fff;color:#0b2039;font-weight:800;text-decoration:none;box-shadow:0 12px 30px #0003}.hint{display:block;margin-top:18px;color:#9fb9cd;font-size:.82rem}
  </style>
</head>
<body>
  <main>
    <img class="icon" src="./images/icon-192.png" alt="">
    <h1>You are offline</h1>
    <p>The installed conference app keeps its programme and abstract text available after the first complete load.</p>
    <a class="button" href="./#/home">Open cached app</a>
    <span class="hint">Maps, external websites and PDFs not opened before may require a connection.</span>
  </main>
</body>
</html>
