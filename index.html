<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f3f6fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#091727" media="(prefers-color-scheme: dark)">
  <meta name="description" content="The programme, abstracts and practical information for the Brain Tumor Meeting 2026 in Berlin.">
  <meta name="application-name" content="BTM 2026">
  <meta name="apple-mobile-web-app-title" content="BTM 2026">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="color-scheme" content="light dark">
  <meta name="msapplication-TileColor" content="#142746">
  <meta property="og:title" content="Brain Tumor Meeting 2026">
  <meta property="og:description" content="Programme, abstracts and venue information for BTM 2026 in Berlin.">
  <meta property="og:image" content="./images/og-card.png">
  <meta property="og:type" content="website">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./images/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
  <link rel="apple-touch-startup-image" href="./images/launch/iphone-375x812@3x.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="./images/launch/iphone-390x844@3x.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="./images/launch/iphone-393x852@3x.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="./images/launch/iphone-430x932@3x.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="stylesheet" href="./src/styles.css">
  <title>BTM 2026</title>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <div id="boot-splash" class="boot-splash" role="status" aria-live="polite">
    <img src="./images/icon-192.png" width="86" height="86" alt="">
    <strong>BTM 2026</strong>
    <span>Preparing your conference app</span>
    <div class="boot-progress" aria-hidden="true"><i></i></div>
  </div>

  <div id="offline-banner" class="offline-banner" hidden>
    <span class="status-dot"></span>
    Offline mode · saved content remains available
  </div>

  <div class="app-shell">
    <aside class="nav-rail" aria-label="Main navigation">
      <a class="rail-brand" href="#/home" aria-label="BTM 2026 home">
        <img src="./images/icon-192.png" alt="">
        <span><strong>BTM</strong><small>2026</small></span>
      </a>
      <nav class="rail-links">
        <a href="#/home" data-nav="home" aria-label="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-4.5v-6h-5v6H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg><span>Home</span>
        </a>
        <a href="#/programme" data-nav="programme" aria-label="Programme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M7 14h3M14 14h3M7 18h3"/></svg><span>Programme</span>
        </a>
        <a href="#/abstracts" data-nav="abstracts" aria-label="Abstracts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4M9 11h6M9 15h6M9 19h4"/></svg><span>Abstracts</span>
        </a>
        <a href="#/explore" data-nav="explore" aria-label="Explore">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-5 7-12a7 7 0 1 0-14 0c0 7 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><span>Explore</span>
        </a>
        <a href="#/cme" data-nav="cme" aria-label="CME and sponsors">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="m9 14-1.5 7L12 18.5 16.5 21 15 14"/><path d="m10 9 1.5 1.5L14.5 7.5"/></svg><span>CME</span>
        </a>
        <a href="#/more" data-nav="more" aria-label="More">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>More</span>
        </a>
      </nav>
      <button class="rail-install" type="button" data-action="install">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>
        <span>Install app</span>
      </button>
    </aside>

    <div class="app-column">
      <header id="topbar" class="topbar">
        <div class="topbar-leading">
          <button id="back-button" class="top-icon back-button" type="button" aria-label="Go back" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <a class="mobile-brand" href="#/home" aria-label="BTM 2026 home">
            <img src="./images/icon-192.png" alt="">
          </a>
        </div>
        <div class="topbar-copy">
          <small id="topbar-kicker">Brain Tumor Meeting</small>
          <strong id="topbar-title">BTM 2026</strong>
        </div>
        <div class="topbar-actions">
          <button class="top-icon" type="button" data-action="theme" aria-label="Change appearance">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.2A8.5 8.5 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2z"/></svg>
          </button>
          <button class="top-icon" type="button" data-action="install" aria-label="Install app">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>
          </button>
        </div>
      </header>

      <main id="app" tabindex="-1" aria-live="polite"></main>

      <nav class="tabbar" aria-label="App tabs">
        <a href="#/home" data-nav="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-4.5v-6h-5v6H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg><span>Home</span>
        </a>
        <a href="#/programme" data-nav="programme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M7 14h3M14 14h3M7 18h3"/></svg><span>Programme</span>
        </a>
        <a href="#/abstracts" data-nav="abstracts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4M9 11h6M9 15h6M9 19h4"/></svg><span>Abstracts</span>
        </a>
        <a href="#/explore" data-nav="explore">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-5 7-12a7 7 0 1 0-14 0c0 7 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><span>Explore</span>
        </a>
        <a href="#/cme" data-nav="cme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="m9 14-1.5 7L12 18.5 16.5 21 15 14"/><path d="m10 9 1.5 1.5L14.5 7.5"/></svg><span>CME</span>
        </a>
        <a href="#/more" data-nav="more">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>More</span>
        </a>
      </nav>
    </div>
  </div>

  <dialog id="action-sheet" class="action-sheet">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div id="sheet-content"></div>
  </dialog>

  <dialog id="install-dialog" class="native-dialog">
    <div class="dialog-top">
      <div>
        <small>BTM 2026</small>
        <h2>Install the conference app</h2>
      </div>
      <button class="top-icon" type="button" data-action="close-install" aria-label="Close install instructions">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="install-content"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
